name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # runs once every day
  workflow_dispatch:       # allows manual run

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=AkshathaHM&theme=tokyonight&no-frame=true&row=1&column=7&margin-w=12"
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add trophy.svg
          git commit -m "Update trophy" || exit 0
          git push
